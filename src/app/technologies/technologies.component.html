<main class="tech-layout">
  <div class="tech-cards">
    @for (technology of technologies(); track technology.id) {
      <app-technology
        [id]="technology.id"
        [name]="technology.name"
        [description]="technology.description"
        [avatarUrl]="technology.avatarUrl"
        (onSelect)="onSelect($event)"
        [isSelected]="selectedTechnology()?.id === technology.id"
      />
    }
  </div>
  <div class="tech-details">
    @if (selectedTechnology()) {
      <app-technology-details [id]="selectedTechnology()!.id" [technology]="selectedTechnology()" />
    } @else {
      <p style="color: aliceblue">Select a technology to view details.</p>
    }
  </div>
</main>
